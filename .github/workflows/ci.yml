name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php:
    name: PHP 8.5
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5.12"
          extensions: mbstring, intl, pdo_sqlite, sqlite3, gd, zip, bcmath, xml, dom
          tools: composer:v2
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

  frontend:
    name: Frontend (${{ matrix.package-manager }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package-manager: [bun, npm, pnpm]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        if: matrix.package-manager == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          version: "9.15.9"

      - name: Setup Node
        if: matrix.package-manager != 'bun'
        uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: ${{ matrix.package-manager }}

      - name: Setup Bun
        if: matrix.package-manager == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Cache Bun
        if: matrix.package-manager == 'bun'
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install frontend dependencies (Bun)
        if: matrix.package-manager == 'bun'
        run: bun install --frozen-lockfile

      - name: Install frontend dependencies (npm)
        if: matrix.package-manager == 'npm'
        run: npm ci

      - name: Install frontend dependencies (pnpm)
        if: matrix.package-manager == 'pnpm'
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build (Bun)
        if: matrix.package-manager == 'bun'
        run: bun run build

      - name: Typecheck and build (npm)
        if: matrix.package-manager == 'npm'
        run: npm run build

      - name: Typecheck and build (pnpm)
        if: matrix.package-manager == 'pnpm'
        run: pnpm run build

      - name: Frontend tests (Bun)
        if: matrix.package-manager == 'bun'
        run: bun run test:frontend

      - name: Frontend tests (npm)
        if: matrix.package-manager == 'npm'
        run: npm run test:frontend

      - name: Frontend tests (pnpm)
        if: matrix.package-manager == 'pnpm'
        run: pnpm run test:frontend
