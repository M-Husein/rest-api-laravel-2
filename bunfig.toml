# Bun-specific configuration. Shared npm settings live in .npmrc.
# Docs: https://bun.sh/docs/runtime/bunfig

[install]
# Bun resolves peer dependencies leniently by default,
# which is the equivalent of npm's legacy-peer-deps=true.
# No extra flag is needed.

# Hoist every dependency to the root node_modules so the root scripts
# (tsc, vite) and the shared tsconfig resolve packages regardless of which
# workspace declares them. Runtime frontend dependencies live in packages/ui;
# build/test tooling lives in the root package.json.
linker = "hoisted"

# Uncomment to get a human-readable text lockfile alongside bun.lock:
# saveTextLockfile = true
